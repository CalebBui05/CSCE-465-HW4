services:
  agent-node:
    build: .
    container_name: agent-node
    command: ["sleep", "infinity"]
    working_dir: /app
    volumes:
      - ./mock_skill.sh:/app/mock_skill.sh:ro
      - ./fake_secrets.txt:/app/fake_secrets.txt:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true

  web-lab:
    build: .
    container_name: web-lab
    command: ["python", "-m", "http.server", "8000", "--directory", "/web"]
    volumes:
      - ./web:/web:ro
    networks:
      hw4net:
        ipv4_address: 172.30.0.40
    security_opt:
      - no-new-privileges:true

  mock-c2:
    build: .
    container_name: mock-c2
    command: ["python", "/app/c2.py"]
    volumes:
      - ./c2.py:/app/c2.py:ro
      - c2-data:/data
    networks:
      hw4net:
        ipv4_address: 172.30.0.66
    security_opt:
      - no-new-privileges:true

volumes:
  c2-data:

networks:
  hw4net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hw4
    ipam:
      config:
        - subnet: 172.30.0.0/24
